<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; font-src 'self' data:; connect-src tirona-local: blob:; img-src 'self' tirona-local: data: blob:; media-src data:;">
<title>Tirona Rebirth</title>
<link rel="stylesheet" href="startup-fonts.css">
<link rel="stylesheet" href="startup-menu.css">
</head>
<body>
<canvas id="study" aria-hidden="true"></canvas>
<div class="shade"></div>
<header><nav aria-label="Window controls"><button id="minimize" aria-label="Minimize">−</button><button id="close" aria-label="Close">×</button></nav></header>
<main>
<section class="invitation">
<h1>Tirona<span>Rebirth</span></h1>
<div class="rule"></div>
<div id="choice">
<fieldset><legend>Narration</legend>
<label><input type="radio" name="voice" value="spoken"><span>Voice on</span></label>
<label><input type="radio" name="voice" value="written" checked><span>Voice off</span></label>
</fieldset>
<p id="availability" class="subtle"></p>
<button id="begin" class="primary">Begin</button>
</div>
<div id="loading" hidden>
<h2 id="status" role="status" aria-live="polite">Loading…</h2>
<p id="detail"></p>
<div class="actions"><button id="skip" class="text-button">Continue without voice</button><button id="retry" class="text-button" hidden>Retry</button><button id="diagnostics" class="text-button" hidden>Copy diagnostics</button></div>
</div>
</section>
</main>
<div id="fade" aria-hidden="true"></div>
<script src="../dist/startup-scene.js"></script>
</body>
</html>
