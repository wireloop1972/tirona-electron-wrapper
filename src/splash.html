<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirona</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #video-container {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    video {
      width: 100vw; height: 100vh;
      object-fit: contain;
    }

    #skip-button {
      position: absolute; bottom: 40px; right: 40px;
      color: white; font-size: 16px; cursor: pointer;
      padding: 10px 20px;
      background-color: rgba(0, 0, 0, 0.3);
      border-radius: 4px; user-select: none;
      opacity: 0;
      animation: fadeIn 0.5s ease-in 2s forwards;
      transition: background-color 0.2s ease;
    }
    #skip-button:hover { background-color: rgba(0, 0, 0, 0.6); }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="splash-video" autoplay>
      <source src="../assets/TironaFading.mp4" type="video/mp4">
    </video>
    <div id="skip-button">Skip</div>
  </div>

  <script>
    const video = document.getElementById('splash-video');
    const skipBtn = document.getElementById('skip-button');

    let finished = false;

    const finish = () => {
      if (finished) return;
      finished = true;
      if (window.splashAPI) window.splashAPI.splashFinished();
    };

    video.addEventListener('ended', finish);
    video.addEventListener('error', () => setTimeout(finish, 500));
    skipBtn.addEventListener('click', finish);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') finish();
    });
    document.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
